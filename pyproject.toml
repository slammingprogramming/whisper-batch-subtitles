[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-batch-subtitles"
version = "1.3.0"
description = "Hardware-aware, resumable media transcription pipeline built on faster-whisper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "SlammingProgramming" },
]
keywords = [
  "whisper",
  "faster-whisper",
  "transcription",
  "subtitles",
  "srt",
  "batch-processing",
  "ffmpeg",
  "speech-to-text",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "deep-translator>=1.11.4",
  "faster-whisper>=1.2.0",
  "PyYAML>=6.0.0",
  "tqdm>=4.66.0",
  # ctranslate2 (pulled in transitively by faster-whisper) does `import pkg_resources`
  # unconditionally at import time. setuptools>=81 dropped pkg_resources entirely, which
  # breaks the whole CLI with ModuleNotFoundError. Pin until ctranslate2 stops needing it.
  "setuptools<81",
]

[project.optional-dependencies]
diarization = [
  "pyannote.audio>=3.3.2",
]
deepl = [
  "deepl>=1.16.0",
]
tui = [
  "rich>=13.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/slammingprogramming/whisper-batch-subtitles"
Repository = "https://github.com/slammingprogramming/whisper-batch-subtitles"
Issues = "https://github.com/slammingprogramming/whisper-batch-subtitles/issues"
Changelog = "https://github.com/slammingprogramming/whisper-batch-subtitles/blob/main/CHANGELOG.md"

[project.scripts]
whisper-batch-subtitles = "whisper_batch_subtitles.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["whisper_batch_subtitles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
