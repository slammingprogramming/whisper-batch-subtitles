name: Feature request
description: Suggest an idea, improvement, or a roadmap item to prioritize.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README's "Project Direction" section first — your idea might already be a known,
        tracked roadmap item.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the tool doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? A CLI flag, a config option, new behavior, etc.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered.
    validations:
      required: false
